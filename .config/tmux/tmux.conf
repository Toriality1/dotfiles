set -g default-terminal "tmux-256color"
# Reset to defaults so reloading does not duplicate this override.
set -su terminal-features
set -as terminal-features ",xterm-256color:RGB"
set -s set-clipboard external
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'sh ~/.config/tmux/clipboard.sh'
bind -r ^ last-window
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind \" split-window -v -c "#{pane_current_path}"
set -g status-interval 1
set -g status-style 'bg=black,fg=white'
set -g status-left-style 'fg=white'
set -g status-left '#[bg=#{?client_prefix,colour1,colour2}] #[bold]#S '
set -g status-left-length 32
set -g window-status-style 'bg=colour0,fg=white'
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=colour2]#[bold] #I #W '
set -g window-status-separator '|'
set -g status-right-style 'bg=colour0,fg=white'
set -g status-right ' #(date +"%d/%m/%Y %H:%M:%S") '
set -g message-style 'bg=colour2,fg=white,bold'
set -g clock-mode-style 24
set -g clock-mode-colour white
set -g mode-style 'bg=colour4'
